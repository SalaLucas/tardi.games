<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cidade Dorme — Dev</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:Arial,sans-serif}body{display:grid;grid-template-columns:1.6fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:8px;padding:8px;box-sizing:border-box}.col{display:flex;flex-direction:column;min-height:0}.table-col{grid-row:1/4}.label{font-size:11px;opacity:.7;margin:0 0 4px}.frame{border:0;flex:1;width:100%;border-radius:8px;background:#020617}</style></head>
<body><script>(function(){
var SCRIPT={table:'/dist/table.js',hand:'/dist/hand.js'};var players=[{playerId:'p1',nick:'Bia'},{playerId:'p2',nick:'Caio'},{playerId:'p3',nick:'Duda'},{playerId:'p4',nick:'Ivo'},{playerId:'p5',nick:'Lia'}];var handFrames={};window.addEventListener('message',onMessage);var table=makeFrame('Mesa',SCRIPT.table,'table-col');document.body.appendChild(table.col);players.forEach(function(player){document.body.appendChild(makeHand(player).col)});table.frame.addEventListener('load',notifyPlayers);
function onMessage(event){var msg=event.data||{};if(event.source===table.frame.contentWindow)fromTable(msg);else fromHand(event.source,msg)}
function fromTable(msg){if(msg.intent!=='tardi.table.sendMessageToHand')return;var frame=handFrames[msg.playerId];if(frame)frame.contentWindow.postMessage(Object.assign({},msg,{intent:'tardi.table.sendGameStateToHand'}),'*')}
function fromHand(source,msg){var playerId=handIdOf(source);if(!playerId)return;if(msg.intent==='tardi.hand.sendMessageToTable'||msg.intent==='tardi.hand.ackTableState')table.frame.contentWindow.postMessage({intent:'tardi.platform.sendToTable',playerId:playerId,payload:msg},'*')}
function notifyPlayers(){table.frame.contentWindow.postMessage({intent:'tardi.platform.notifyPlayersChange',players:players},'*')}
function makeHand(player){var made=makeFrame(player.nick,SCRIPT.hand,'');handFrames[player.playerId]=made.frame;return made}
function makeFrame(label,scriptUrl,extraClass){var col=document.createElement('div');col.className='col '+extraClass;var caption=document.createElement('p');caption.className='label';caption.textContent=label;var frame=document.createElement('iframe');frame.className='frame';frame.title=label;frame.sandbox='allow-scripts allow-same-origin';frame.srcdoc=srcdoc(scriptUrl);col.appendChild(caption);col.appendChild(frame);return{col:col,frame:frame}}
function srcdoc(scriptUrl){return '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%}</style></head><body><script src="'+scriptUrl+'"><\/script></body></html>'}
function handIdOf(source){for(var id in handFrames)if(handFrames[id].contentWindow===source)return id;return null}
}())</script></body></html>
