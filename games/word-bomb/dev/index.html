<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bomba de Palavras</title>
<style>html,body{margin:0;height:100%;background:#10091f;font-family:Arial,sans-serif}body{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:12px;padding:12px;box-sizing:border-box}.col{display:flex;flex-direction:column;min-height:0;color:white}.label{margin:0 0 6px;opacity:.7}.frame{border:0;flex:1;width:100%;border-radius:10px;background:#160b2a}.banner{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:#ffbd39;color:#32112b;font-weight:bold}</style></head>
<body><script>(function(){var players=[{playerId:'p1',nick:'Jogador 1'},{playerId:'p2',nick:'Jogador 2'}],hands={},banner=document.createElement('div');banner.className='banner';var table=make('Mesa (TV)','/table.js'),left=makeHand(players[0]),right=makeHand(players[1]);document.body.append(left.col,table.col,right.col,banner);window.addEventListener('message',function(event){var msg=event.data||{};if(event.source===table.frame.contentWindow){if(msg.intent==='tardi.table.sendMessageToHand'){var hand=hands[msg.playerId];if(hand)hand.contentWindow.postMessage(Object.assign({},msg,{intent:'tardi.table.sendGameStateToHand'}),'*')}else if(msg.intent==='tardi.table.gameOver'){banner.textContent=(msg.victor?nick(msg.victor)+' venceu!':'Empate!');banner.style.display='block'}}else{var id=handId(event.source);if(id&&(msg.intent==='tardi.hand.sendMessageToTable'||msg.intent==='tardi.hand.ackTableState'))table.frame.contentWindow.postMessage({intent:'tardi.platform.sendToTable',playerId:id,payload:msg},'*')}});table.frame.addEventListener('load',notifyPlayers);setTimeout(notifyPlayers,100);setTimeout(notifyPlayers,500);function notifyPlayers(){table.frame.contentWindow.postMessage({intent:'tardi.platform.notifyPlayersChange',players:players},'*')}function makeHand(player){var made=make('Controle — '+player.nick,'/hand.js');hands[player.playerId]=made.frame;return made}function make(label,src){var col=document.createElement('div'),cap=document.createElement('p'),frame=document.createElement('iframe');col.className='col';cap.className='label';cap.textContent=label;frame.className='frame';frame.title=label;frame.sandbox='allow-scripts allow-same-origin';frame.srcdoc='<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script src="'+src+'"><\/script></body></html>';col.append(cap,frame);return{col:col,frame:frame}}function handId(source){for(var id in hands)if(hands[id].contentWindow===source)return id}function nick(id){for(var i=0;i<players.length;i++)if(players[i].playerId===id)return players[i].nick}}())</script></body></html>
